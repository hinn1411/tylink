AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tylink

  Sample SAM Template for tylink

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    Timeout: 20
    MemorySize: 512
    Tracing: Active
    Layers:
      - arn:aws:lambda:us-east-1:580247275435:layer:LambdaInsightsExtension:66
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: tylink
        POWERTOOLS_METRICS_NAMESPACE: tylink
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions

Parameters:
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >
      Google OAuth client secret. CF can't resolve an ssm-secure dynamic reference for
      AWS::Cognito::UserPoolIdentityProvider

  AlertEmail:
    Type: String
    Description: >
      Email address to receive CloudWatch Alarm notifications via SNS. Not stored in
      samconfig.toml (git-tracked) — same reasoning as GoogleClientSecret — pass at deploy time
      via scripts/deploy/deploy.sh's ALERT_EMAIL env var.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # Ensures the Google identity provider exists before the client does.
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      # Placeholder until the frontend exists — swap for the real app URL(s).
      CallbackURLs:
        - https://example.com/callback
      LogoutURLs:
        - https://example.com/logout

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # AccountId suffix keeps the domain prefix globally unique.
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}"

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "{{resolve:ssm:/tylink/google-oauth-client-id:1}}"
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email

  ExtractTokenAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.auth.ExtractTokenAuthorizerHandler::handleRequest
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.login.LoginHandler::handleRequest
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:InitiateAuth
              Resource: !GetAtt UserPool.Arn
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        # Public route, no Authorizer
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/auth/login
            Method: post

  # Explicit HTTP API for using custom authorizer
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        # Captures per-request status and integration errors, including throttled invocations
        # that leave no other trace.
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime",
          "sourceIp":"$context.identity.sourceIp","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "integrationStatus":"$context.integration.status",
          "integrationErrorMessage":"$context.integrationErrorMessage",
          "errorMessage":"$context.error.message",
          "responseLatency":"$context.responseLatency",
          "integrationLatency":"$context.integration.latency"}
      Auth:
        Authorizers:
          # Allow all traffic, only extract token
          ExtractTokenAuthorizer:
            FunctionArn: !Ref ExtractTokenAuthorizerFunction.Alias
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            # Ensures this authorizer runs unconditionally on every request, including
            # anonymous ones.
            Identity:
              Context:
                - routeKey
          # Native authorizer, only accepts valid id token. Otherwise, rejects all.
          NativeJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-http-api-access-logs"
      RetentionInDays: 14

  # Account-level role required for API Gateway to write access logs.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # Grants API Gateway permission to invoke the authorizer's live alias.
  ExtractTokenAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExtractTokenAuthorizerFunction.Alias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*"

  UrlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Required by Powertools' Idempotent module
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true

  ShortenUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.shorten.ShortenUrlHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        ShortenUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls
            Method: post
            Auth:
              Authorizer: ExtractTokenAuthorizer

  RedirectUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.redirect.RedirectUrlHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
          # Only used when the short code is PUBLIC + ACTIVE — see RedirectUrlHandler and
          # docs/technical_decisions/15-cloudfront-edge-caching.md.
          TIME_TO_LIVE: "300"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        RedirectUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls/{shortCode}
            Method: get
            Auth:
              Authorizer: ExtractTokenAuthorizer

  ListUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.list.ListUrlsHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        ListUrls:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls
            Method: get
            Auth:
              Authorizer: NativeJwtAuthorizer

  DeleteUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.delete.DeleteUrlHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        DeleteUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls/{shortCode}
            Method: delete
            Auth:
              Authorizer: NativeJwtAuthorizer

  UpdateUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.features.update.UpdateUrlHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Events:
        UpdateUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls/{shortCode}
            Method: patch
            Auth:
              Authorizer: NativeJwtAuthorizer

  # Nested stack for dashboards
  DashboardStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: infrastructures/dashboards.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName
        ShortenUrlFunctionName: !Ref ShortenUrlFunction
        RedirectUrlFunctionName: !Ref RedirectUrlFunction
        ListUrlsFunctionName: !Ref ListUrlsFunction
        UpdateUrlFunctionName: !Ref UpdateUrlFunction
        DeleteUrlFunctionName: !Ref DeleteUrlFunction
        LoginFunctionName: !Ref LoginFunction
        ExtractTokenAuthorizerFunctionName: !Ref ExtractTokenAuthorizerFunction

  # Nested stack for CloudWatch Alarms + SNS email notifications
  AlarmStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: infrastructures/alarms.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName
        AlertEmail: !Ref AlertEmail
        ShortenUrlFunctionName: !Ref ShortenUrlFunction
        RedirectUrlFunctionName: !Ref RedirectUrlFunction
        ListUrlsFunctionName: !Ref ListUrlsFunction
        UpdateUrlFunctionName: !Ref UpdateUrlFunction
        DeleteUrlFunctionName: !Ref DeleteUrlFunction
        LoginFunctionName: !Ref LoginFunction
        ExtractTokenAuthorizerFunctionName: !Ref ExtractTokenAuthorizerFunction

  # Nested stack for the CloudFront distribution in front of HttpApi
  CloudFrontStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: infrastructures/cloudfront.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName
        HttpApiId: !Ref HttpApi

Outputs:
  CloudFrontUrl:
    Description: "CloudFront distribution URL — primary entry point for the API (edge-cached redirects)"
    Value: !Sub "https://${CloudFrontStack.Outputs.DistributionDomainName}"
  HttpApiUrl:
    Description: "Base URL for the tylink HTTP API, direct to the API Gateway origin (bypasses CloudFront's edge cache — use CloudFrontUrl for normal use)"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ShortenUrlApi:
    Description: "API Gateway endpoint URL for the shorten-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls"
  RedirectUrlApi:
    Description: "API Gateway endpoint URL for the redirect-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls/{shortCode}"
  ShortenUrlFunction:
    Description: "Shorten URL Lambda Function ARN"
    Value: !GetAtt ShortenUrlFunction.Arn
  ShortenUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Shorten URL function"
    Value: !GetAtt ShortenUrlFunctionRole.Arn
  RedirectUrlFunction:
    Description: "Redirect URL Lambda Function ARN"
    Value: !GetAtt RedirectUrlFunction.Arn
  RedirectUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Redirect URL function"
    Value: !GetAtt RedirectUrlFunctionRole.Arn
  ListUrlsApi:
    Description: "API Gateway endpoint URL for the list-URLs route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls"
  ListUrlsFunction:
    Description: "List URLs Lambda Function ARN"
    Value: !GetAtt ListUrlsFunction.Arn
  ListUrlsFunctionIamRole:
    Description: "Implicit IAM Role created for the List URLs function"
    Value: !GetAtt ListUrlsFunctionRole.Arn
  DeleteUrlApi:
    Description: "API Gateway endpoint URL for the delete-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls/{shortCode}"
  DeleteUrlFunction:
    Description: "Delete URL Lambda Function ARN"
    Value: !GetAtt DeleteUrlFunction.Arn
  DeleteUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Delete URL function"
    Value: !GetAtt DeleteUrlFunctionRole.Arn
  UpdateUrlApi:
    Description: "API Gateway endpoint URL for the update-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls/{shortCode}"
  UpdateUrlFunction:
    Description: "Update URL Lambda Function ARN"
    Value: !GetAtt UpdateUrlFunction.Arn
  UpdateUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Update URL function"
    Value: !GetAtt UpdateUrlFunctionRole.Arn
  ExtractTokenAuthorizerFunction:
    Description: "Extract-Token Authorizer Lambda Function ARN"
    Value: !GetAtt ExtractTokenAuthorizerFunction.Arn
  LoginApi:
    Description: "API Gateway endpoint URL for the login route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/auth/login"
  LoginFunction:
    Description: "Login Lambda Function ARN"
    Value: !GetAtt LoginFunction.Arn
  LoginFunctionIamRole:
    Description: "Implicit IAM Role created for the Login function"
    Value: !GetAtt LoginFunctionRole.Arn
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref UserPool
  CognitoHostedUiDomain:
    Description: "Cognito Hosted UI base URL"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  CognitoIdpResponseRedirectUri:
    Description: "Redirect URI to register as the Google OAuth client's Authorized redirect URI"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  UserPoolClientId:
    Description: "Cognito User Pool App Client ID"
    Value: !Ref UserPoolClient
  LambdaDurationDashboardUrl:
    Description: "CloudWatch Dashboard - Lambda Duration Percentiles"
    Value: !GetAtt DashboardStack.Outputs.LambdaDurationDashboardUrl
  CustomMetricsDashboardUrl:
    Description: "CloudWatch Dashboard - Custom EMF Metrics (ColdStart, IdempotencyMiss, ShortCodeCollisionRetries)"
    Value: !GetAtt DashboardStack.Outputs.CustomMetricsDashboardUrl
  AlarmTopicArn:
    Description: "SNS Topic ARN for CloudWatch Alarm notifications"
    Value: !GetAtt AlarmStack.Outputs.AlarmTopicArn
