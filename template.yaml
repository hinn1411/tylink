AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tylink

  Sample SAM Template for tylink

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    Timeout: 20
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: tylink

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  OptionalJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.auth.OptionalJwtAuthorizerHandler::handleRequest
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient

  # Explicit HTTP API (rather than the implicit one SAM would otherwise create from the
  # functions' Events blocks) so routes can opt into the custom authorizer below. Every
  # HttpApi event must reference ApiId: !Ref HttpApi, or SAM implicitly creates a second,
  # separate API for whichever routes omit it.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          # REQUEST-type Lambda authorizer, not a native JWT authorizer: it never denies a
          # request (isAuthorized is always true), so routes behind it stay reachable by
          # anonymous callers — something a native JWT authorizer can't express (it's
          # all-or-nothing per route). When the Authorization header carries a valid Cognito
          # token, OptionalJwtAuthorizerFunction verifies it and passes the caller's id
          # through as `ownerId` in the authorizer context; downstream handlers read that
          # via requestContext.authorizer.lambda, never a raw JWT. See
          # docs/technical_decisions/04-dynamodb-access-patterns.md.
          OptionalJwtAuthorizer:
            FunctionArn: !GetAtt OptionalJwtAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization

  UrlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ShortenUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.shorten.ShortenUrlHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
      Events:
        ShortenUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls
            Method: post
            Auth:
              Authorizer: OptionalJwtAuthorizer

  DecodeUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: com.tylink.decode.DecodeUrlHandler::handleRequest
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
      Events:
        DecodeUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/urls/{shortCode}
            Method: get

Outputs:
  HttpApiUrl:
    Description: "Base URL for the tylink HTTP API"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ShortenUrlApi:
    Description: "API Gateway endpoint URL for the shorten-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls"
  DecodeUrlApi:
    Description: "API Gateway endpoint URL for the decode-URL route"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/urls/{shortCode}"
  ShortenUrlFunction:
    Description: "Shorten URL Lambda Function ARN"
    Value: !GetAtt ShortenUrlFunction.Arn
  ShortenUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Shorten URL function"
    Value: !GetAtt ShortenUrlFunctionRole.Arn
  DecodeUrlFunction:
    Description: "Decode URL Lambda Function ARN"
    Value: !GetAtt DecodeUrlFunction.Arn
  DecodeUrlFunctionIamRole:
    Description: "Implicit IAM Role created for the Decode URL function"
    Value: !GetAtt DecodeUrlFunctionRole.Arn
  OptionalJwtAuthorizerFunction:
    Description: "Optional-JWT Authorizer Lambda Function ARN"
    Value: !GetAtt OptionalJwtAuthorizerFunction.Arn
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool App Client ID"
    Value: !Ref UserPoolClient
